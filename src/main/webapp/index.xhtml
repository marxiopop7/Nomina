<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Sistema de Gestión de Nómina</title>
    <h:outputStylesheet library="css" name="estilos.css" />
</h:head>
<h:body>

    <div class="pagina-cabecera">
        <h1>Sistema de Gestión de Nómina</h1>
        <p class="pagina-subtitulo">Registra, calcula y consulta el histórico de nóminas de los empleados.</p>
    </div>

    <div class="contenedor-nomina">
        <h:form id="frmNomina">
            <p:growl id="mensajes" showDetail="true" life="4000" />

            <!-- 1. FORMULARIO DE REGISTRO / EDICIÓN -->
            <p:panel header="#{nominaBean.modoEdicion ? 'Editar Registro de Nómina' : 'Registrar y Calcular Nómina'}"
                     styleClass="panel-centrado">

                <p:panelGrid columns="4" layout="grid" styleClass="ui-fluid">

                    <p:outputLabel value="Identificación:" for="txtDocId" />
                    <p:inputText id="txtDocId" value="#{nominaBean.nomina.empleado.docId}" required="true"
                                 requiredMessage="Falta la identificación." disabled="#{nominaBean.modoEdicion}"
                                 maxlength="15" validatorMessage="La identificación debe contener solo números.">
                        <p:keyFilter mask="num" />
                        <f:validateRegex pattern="^\d+$" />
                    </p:inputText>

                    <p:outputLabel value="Nombres:" for="txtNombres" />
                    <p:inputText id="txtNombres" value="#{nominaBean.nomina.empleado.nombre}" required="true"
                                 requiredMessage="Faltan los nombres." validatorMessage="Los nombres solo deben contener letras.">
                        <p:keyFilter regEx="/[a-zA-ZÁÉÍÓÚÜáéíóúüÑñ\s]/" />
                        <f:validateRegex pattern="^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+(\s[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+)*$" />
                    </p:inputText>

                    <p:outputLabel value="Apellidos:" for="txtApellidos" />
                    <p:inputText id="txtApellidos" value="#{nominaBean.nomina.empleado.apellido}" required="true"
                                 requiredMessage="Faltan los apellidos." validatorMessage="Los apellidos solo deben contener letras.">
                        <p:keyFilter regEx="/[a-zA-ZÁÉÍÓÚÜáéíóúüÑñ\s]/" />
                        <f:validateRegex pattern="^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+(\s[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+)*$" />
                    </p:inputText>

                    <p:outputLabel value="Correo Electrónico:" for="txtCorreo" />
                    <p:inputText id="txtCorreo" value="#{nominaBean.nomina.empleado.correo}" required="true"
                                 requiredMessage="Falta el correo." validatorMessage="Formato de correo inválido (ejemplo@dominio.com).">
                        <f:validateRegex pattern="^[\w.+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$" />
                    </p:inputText>

                    <p:outputLabel value="Cargo:" for="txtCargo" />
                    <p:inputText id="txtCargo" value="#{nominaBean.nomina.empleado.cargo}" required="true"
                                 requiredMessage="Falta especificar el cargo." />

                    <p:outputLabel value="Salario Básico:" for="cmbSalario" />
                    <h:selectOneMenu id="cmbSalario" value="#{nominaBean.nomina.empleado.salarioBasico}" required="true"
                                     requiredMessage="Seleccione el salario básico." styleClass="campo-select">
                        <f:selectItem itemLabel="Seleccione..." itemValue="" noSelectionOption="true" />
                        <f:selectItem itemLabel="$ 1.750.000" itemValue="1750000" />
                        <f:selectItem itemLabel="$ 2.000.000" itemValue="2000000" />
                        <f:selectItem itemLabel="$ 2.500.000" itemValue="2500000" />
                        <f:selectItem itemLabel="$ 3.000.000" itemValue="3000000" />
                        <f:selectItem itemLabel="$ 4.000.000" itemValue="4000000" />
                        <f:selectItem itemLabel="$ 5.000.000" itemValue="5000000" />
                    </h:selectOneMenu>

                    <p:outputLabel value="Días Trabajados:" for="txtDias" />
                    <p:inputText id="txtDias" value="#{nominaBean.nomina.diasTrabajados}" required="true"
                                 requiredMessage="Faltan los días trabajados." validatorMessage="Los días trabajados deben estar entre 1 y 30."
                                 maxlength="2">
                        <p:keyFilter mask="num" />
                        <f:validateLongRange minimum="1" maximum="30" />
                    </p:inputText>

                    <p:outputLabel value="Mes de Nómina:" for="cmbMes" />
                    <h:selectOneMenu id="cmbMes" value="#{nominaBean.mesSeleccionado}" required="true"
                                     requiredMessage="Seleccione el mes." styleClass="campo-select">
                        <f:selectItem itemLabel="Mes..." itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItem itemLabel="Enero" itemValue="1" />
                        <f:selectItem itemLabel="Febrero" itemValue="2" />
                        <f:selectItem itemLabel="Marzo" itemValue="3" />
                        <f:selectItem itemLabel="Abril" itemValue="4" />
                        <f:selectItem itemLabel="Mayo" itemValue="5" />
                        <f:selectItem itemLabel="Junio" itemValue="6" />
                        <f:selectItem itemLabel="Julio" itemValue="7" />
                        <f:selectItem itemLabel="Agosto" itemValue="8" />
                        <f:selectItem itemLabel="Septiembre" itemValue="9" />
                        <f:selectItem itemLabel="Octubre" itemValue="10" />
                        <f:selectItem itemLabel="Noviembre" itemValue="11" />
                        <f:selectItem itemLabel="Diciembre" itemValue="12" />
                    </h:selectOneMenu>

                    <p:outputLabel value="Año de Nómina:" for="cmbAnio" />
                    <h:selectOneMenu id="cmbAnio" value="#{nominaBean.anioSeleccionado}" required="true"
                                     requiredMessage="Seleccione el año." styleClass="campo-select">
                        <f:selectItem itemLabel="Año..." itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{nominaBean.aniosDisponibles}" />
                    </h:selectOneMenu>

                </p:panelGrid>

                <f:facet name="footer">
                    <p:commandButton value="#{nominaBean.modoEdicion ? 'Guardar Cambios' : 'Calcular y Guardar'}"
                                     action="#{nominaBean.calcular}" update="@form" icon="pi pi-save" />
                    <p:commandButton value="#{nominaBean.modoEdicion ? 'Cancelar Edición' : 'Limpiar'}"
                                     action="#{nominaBean.limpiar}" update="@form" process="@this" styleClass="ui-button-secondary" />
                </f:facet>
            </p:panel>

            <!-- 2. RESUMEN DEL CÁLCULO INDIVIDUAL -->
            <p:panel header="Resultado del Cálculo" styleClass="panel-centrado resultado-panel" rendered="#{nominaBean.mostrarResultados}">
                <p:panelGrid columns="2" layout="grid">
                    <p:outputLabel value="Salario Devengado:" />
                    <h:outputText value="#{nominaBean.nomina.salarioDevengado}">
                        <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                    </h:outputText>

                    <p:outputLabel value="Auxilio de Transporte:" />
                    <h:outputText value="#{nominaBean.nomina.auxTransporte}">
                        <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                    </h:outputText>

                    <p:outputLabel value="Descuento Salud (4%):" />
                    <h:outputText value="#{nominaBean.nomina.descSalud}">
                        <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                    </h:outputText>

                    <p:outputLabel value="Descuento Pensión (4%):" />
                    <h:outputText value="#{nominaBean.nomina.descPension}">
                        <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                    </h:outputText>

                    <p:outputLabel value="Neto a Pagar:" style="font-weight:bold;" />
                    <h:outputText value="#{nominaBean.nomina.netoPagar}" styleClass="valor-destacado">
                        <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                    </h:outputText>
                </p:panelGrid>
            </p:panel>

            <!-- 3. TABLA DEL HISTÓRICO DE NÓMINAS GUARDADAS -->
            <p:panel header="Historial de Nóminas Registradas" styleClass="panel-ancho">
                <div class="tabla-scroll">
                    <p:dataTable id="tablaNominas" value="#{nominaBean.listaHistorico}" var="nom"
                                 emptyMessage="No hay nóminas registradas aún." stripedRows="true" paginator="true" rows="5">

                        <p:column headerText="Documento">
                            <h:outputText value="#{nom.empleado.docId}" />
                        </p:column>

                        <p:column headerText="Empleado">
                            <h:outputText value="#{nom.empleado.obtenerNombreCompleto()}" />
                        </p:column>

                        <p:column headerText="Cargo">
                            <h:outputText value="#{nom.empleado.cargo}" />
                        </p:column>

                        <p:column headerText="Correo">
                            <h:outputText value="#{nom.empleado.correo}" />
                        </p:column>

                        <p:column headerText="Mes / Período">
                            <h:outputText value="#{nom.empleado.getMesNominaLegible(nom.mesNomina)}" />
                        </p:column>

                        <p:column headerText="Días">
                            <h:outputText value="#{nom.diasTrabajados}" />
                        </p:column>

                        <p:column headerText="Salario Básico">
                            <h:outputText value="#{nom.empleado.salarioBasico}">
                                <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Salario Devengado">
                            <h:outputText value="#{nom.salarioDevengado}">
                                <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Aux. Transporte">
                            <h:outputText value="#{nom.auxTransporte}">
                                <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Desc. Salud">
                            <h:outputText value="#{nom.descSalud}">
                                <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Desc. Pensión">
                            <h:outputText value="#{nom.descPension}">
                                <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Neto a Pagar" styleClass="valor-destacado">
                            <h:outputText value="#{nom.netoPagar}">
                                <f:convertNumber type="currency" currencySymbol="$ " maxFractionDigits="0" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Acciones" style="width:120px; text-align:center;">
                            <p:commandButton icon="pi pi-pencil" title="Editar"
                                             actionListener="#{nominaBean.prepararEdicion(nom)}"
                                             update=":frmNomina" process="@this" styleClass="ui-button-info rounded-button"
                                             style="margin-right:6px;" />
                            <p:commandButton icon="pi pi-trash" title="Eliminar"
                                             actionListener="#{nominaBean.eliminar(nom.empleado.docId, nom.mesNomina)}"
                                             update=":frmNomina" process="@this" styleClass="ui-button-danger rounded-button">
                                <p:confirm header="Confirmación" message="¿Desea eliminar este registro de nómina?" icon="pi pi-exclamation-triangle" />
                            </p:commandButton>
                        </p:column>

                    </p:dataTable>
                </div>
            </p:panel>

            <!-- DIÁLOGO GLOBAL DE CONFIRMACIÓN -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times" />
            </p:confirmDialog>

        </h:form>
    </div>
</h:body>
</html>
